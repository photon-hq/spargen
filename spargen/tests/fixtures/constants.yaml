openapi: 3.1.0
info: { title: Constants and maps, version: 1.0.0 }
paths:
  /pets:
    get:
      operationId: listActivePets
      parameters:
        - { name: groupBy, in: query, required: true, schema: { type: string, const: day } }
        - { name: interval, in: query, schema: { type: string, enum: [hour] } }
        # An optional nullable constant is compared once its field is unwrapped, in both spellings.
        - { name: unit, in: query, schema: { type: [string, 'null'], const: seconds } }
        - { name: zone, in: query, schema: { type: [string, 'null'], enum: [utc] } }
      responses:
        '200':
          description: One active pet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivePet' }
  /events:
    post:
      operationId: sendEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Event' }
      responses:
        '200':
          description: The event, echoed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404':
          description: Not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/NotFoundProblem' }
components:
  schemas:
    # A string `const` field is a checked `String`, in response-only and request models alike, with
    # every combination of requiredness and nullability.
    NotFoundProblem:
      type: object
      additionalProperties: false
      required: [code, status]
      properties:
        code: { type: string, const: NOT_FOUND, description: The problem code. }
        status: { type: integer, const: 404 }
        hint: { type: string, const: retry }
    Event:
      type: object
      additionalProperties: false
      required: [type, maybe]
      properties:
        type: { type: string, const: event.created }
        maybe: { type: [string, 'null'], const: here }
        optional: { type: string, const: sometimes }
        optionalNullable:
          anyOf:
            - { type: string, const: perhaps }
            - { type: 'null' }
        defaulted: { type: string, const: fixed, default: fixed }
        # Elsewhere a constant keeps its one-variant enum, which is what checks it there.
        kinds:
          type: array
          items: { type: string, const: only }
        # A map-only object is a map, not a wrapper struct.
        labels:
          type: object
          additionalProperties: { type: string }
    # `allOf` over a union with a constraint component: the variants keep their own types and the
    # constraint is checked on every value.
    Cat:
      type: object
      additionalProperties: false
      required: [kind, status]
      properties:
        kind: { type: string, const: cat }
        status: { type: string, enum: [active, retired] }
    Dog:
      type: object
      additionalProperties: false
      required: [kind, status]
      properties:
        kind: { type: string, const: dog }
        status: { type: string, enum: [active, retired] }
    Pet:
      anyOf:
        - { $ref: '#/components/schemas/Cat' }
        - { $ref: '#/components/schemas/Dog' }
    ActiveConstraint:
      type: object
      required: [status]
      properties:
        status: { type: string, const: active }
    ActivePet:
      allOf:
        - { $ref: '#/components/schemas/Pet' }
        - { $ref: '#/components/schemas/ActiveConstraint' }
